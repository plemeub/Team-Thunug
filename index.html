<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Thunug</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    header {
      background: #ffffff;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    #search {
      padding: 10px;
      font-size: 16px;
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    main {
      padding: 20px;
    }

    h2 {
      margin-top: 30px;
      margin-bottom: 10px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      text-decoration: none;
      color: black;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #555;
    }
  </style>
</head>

<body>
  <header>
    <h1>Team Thunug</h1>
    <input type="text" id="search" placeholder="Search games...">
  </header>

  <main>
    <!-- Featured Games -->
    <section class="featured">
      <h2>Featured Games</h2>
      <div class="game-grid">
        <a class="game-card" href="games/drive-mad/">
          <img src="assets/thumbnails/drive-mad.jpg" alt="Drive Mad">
          <p>Drive Mad</p>
        </a>

        <a class="game-card" href="games/run-3/">
          <img src="assets/thumbnails/run-3.jpg" alt="Run 3">
          <p>Run 3</p>
        </a>

        <a class="game-card" href="games/moto-x3m/">
          <img src="assets/thumbnails/moto-x3m.jpg" alt="Moto X3M">
          <p>Moto X3M</p>
        </a>
      </div>
    </section>

    <!-- All Games (auto-generated) -->
    <section>
      <h2>All Games</h2>
      <div class="game-grid" id="gameList"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 Team Thunug</p>
  </footer>

  <script src="script.js"></script>
</body>
